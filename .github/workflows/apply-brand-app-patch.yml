name: Apply brand app patch

on:
  push:
    paths:
      - .github/brand-app.patch
      - .github/workflows/apply-brand-app-patch.yml

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply app patch
        run: |
          git apply --check .github/brand-app.patch
          git apply .github/brand-app.patch
      - name: Remove temporary patch machinery
        run: |
          rm -f .github/brand-app.patch .github/workflows/apply-brand-app-patch.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/types.ts .github/brand-app.patch .github/workflows/apply-brand-app-patch.yml
          git commit -m "Apply brand header footer and client contact fields" || exit 0
          git push
