name: Apply strategy section patch

on:
  push:
    paths:
      - .github/strategy-section.patch
      - .github/workflows/apply-strategy-section-patch.yml

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply strategy section patch
        run: |
          git apply --check .github/strategy-section.patch
          git apply .github/strategy-section.patch
      - name: Remove temporary patch machinery
        run: |
          rm -f .github/strategy-section.patch .github/workflows/apply-strategy-section-patch.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/index.css .github/strategy-section.patch .github/workflows/apply-strategy-section-patch.yml
          git commit -m "Add strategic diagnosis and clean header footer" || exit 0
          git push
