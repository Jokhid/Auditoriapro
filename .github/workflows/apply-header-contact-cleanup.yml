name: Apply header contact cleanup

on:
  push:
    paths:
      - .github/header-contact-cleanup.patch
      - .github/workflows/apply-header-contact-cleanup.yml

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply header cleanup patch
        run: |
          git apply --check .github/header-contact-cleanup.patch
          git apply .github/header-contact-cleanup.patch
      - name: Remove temporary patch machinery
        run: |
          rm -f .github/header-contact-cleanup.patch .github/workflows/apply-header-contact-cleanup.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/header-contact-cleanup.patch .github/workflows/apply-header-contact-cleanup.yml
          git commit -m "Remove duplicate header phone action" || exit 0
          git push
