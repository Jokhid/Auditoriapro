<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auditoría Previsional | José Carlos Hidalgo</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        const cleanReportCss = `
          main [class*="bg-[#1A1A1A]"],
          main [class*="bg-[#0F172A]"],
          main [class*="bg-slate-900"],
          main [class*="bg-slate-950"],
          main [class*="bg-black"],
          main > section:first-of-type,
          footer {
            background: #ffffff !important;
            background-image: none !important;
            color: #1A1A1A !important;
          }

          main [class*="text-white"],
          main [class*="text-slate-100"],
          main [class*="text-slate-200"],
          main [class*="text-slate-300"],
          footer,
          footer p,
          footer li,
          footer span {
            color: #1A1A1A !important;
          }

          main [class*="border-white"],
          main [class*="border-slate-700"],
          main [class*="border-slate-800"],
          main [class*="border-slate-850"] {
            border-color: #E5E5E5 !important;
          }

          main h1,
          main h2,
          main h3,
          main h4,
          main h5,
          main h6 {
            color: #1A1A1A !important;
          }

          main [class*="text-[#C5A566]"],
          main [class*="text-orange"],
          main [class*="text-amber"],
          footer a {
            color: #C5A566 !important;
          }

          header.sticky,
          header.sticky *:not([class*="text-[#C5A566]"]) {
            background-color: #1A1A1A !important;
            color: #ffffff !important;
          }

          header.sticky [class*="text-[#C5A566]"],
          header.sticky a:hover,
          header.sticky svg {
            color: #C5A566 !important;
          }

          @media print {
            @page {
              size: A4;
              margin: 42mm 12mm 14mm;
            }

            * {
              print-color-adjust: exact !important;
              -webkit-print-color-adjust: exact !important;
            }

            html,
            body {
              background: #ffffff !important;
            }

            body {
              padding: 0 !important;
              margin: 0 !important;
            }

            header.sticky {
              position: fixed !important;
              top: 0 !important;
              left: 0 !important;
              right: 0 !important;
              height: 24mm !important;
              min-height: 24mm !important;
              max-height: 24mm !important;
              overflow: hidden !important;
              z-index: 9999 !important;
              background: #1A1A1A !important;
              color: #ffffff !important;
              border-bottom: 0 !important;
              box-shadow: none !important;
              padding-top: 4mm !important;
              padding-bottom: 4mm !important;
            }

            header.sticky > * {
              max-height: 16mm !important;
              overflow: hidden !important;
            }

            main {
              max-width: none !important;
              width: 100% !important;
              padding-top: 4mm !important;
              padding-bottom: 0 !important;
              background: #ffffff !important;
            }

            main section {
              background: #ffffff !important;
              background-image: none !important;
              box-shadow: none !important;
              break-inside: auto !important;
              page-break-inside: auto !important;
              margin-top: 0 !important;
              margin-bottom: 9mm !important;
            }

            main article,
            main .rounded-lg,
            main .rounded-xl,
            main .rounded-2xl,
            main .rounded-3xl {
              background: #ffffff !important;
              background-image: none !important;
              box-shadow: none !important;
              break-inside: avoid-page !important;
              page-break-inside: avoid !important;
            }

            main h1,
            main h2,
            main h3,
            main h4 {
              break-after: avoid !important;
              page-break-after: avoid !important;
            }

            main svg {
              max-width: 100% !important;
            }

            footer {
              display: none !important;
            }

            button,
            [role="button"] {
              box-shadow: none !important;
            }

            button:has(svg + span),
            button:has(.lucide-download),
            button:has(.lucide-arrow-left) {
              display: none !important;
            }
          }
        `;

        function installReportStyles() {
          let style = document.getElementById("audit-report-clean-print-styles");
          if (!style) {
            style = document.createElement("style");
            style.id = "audit-report-clean-print-styles";
            document.head.appendChild(style);
          }
          style.textContent = cleanReportCss;
        }

        installReportStyles();
        document.addEventListener("DOMContentLoaded", installReportStyles);
        window.addEventListener("load", installReportStyles);
        window.setTimeout(installReportStyles, 1000);
      })();

      document.addEventListener(
        "click",
        function (event) {
          const button = event.target && event.target.closest ? event.target.closest("button") : null;
          if (!button) return;
          const text = (button.textContent || "").toLowerCase();
          const isPdfButton = text.includes("descargar") && (text.includes("pdf") || text.includes("auditoría") || text.includes("auditoria"));
          if (!isPdfButton) return;
          event.preventDefault();
          event.stopImmediatePropagation();
          window.setTimeout(function () {
            window.print();
          }, 80);
        },
        true
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
